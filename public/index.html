<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manus RTMP Streamer Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .pulse-live { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="gradient-bg h-64 w-full absolute top-0 z-0"></div>
  
  <div class="relative z-10 container mx-auto px-4 py-8">
    <header class="text-white mb-10 flex justify-between items-center">
      <div>
        <h1 class="text-4xl font-bold mb-2">Manus RTMP Streamer Pro</h1>
        <p class="opacity-80">Professional Live Streaming Control Panel • <span class="font-semibold">Auto-Quality Enabled</span></p>
      </div>
      <div id="liveIndicator" class="hidden items-center bg-red-500 px-4 py-2 rounded-full text-white font-bold text-sm pulse-live">
        <i class="fas fa-circle mr-2"></i> LIVE
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column: Upload & Management -->
      <div class="lg:col-span-1 space-y-8">
        <!-- Upload Section -->
        <div class="glass rounded-2xl shadow-xl p-6 border border-white/20">
          <h2 class="text-xl font-semibold mb-4 flex items-center">
            <i class="fas fa-cloud-upload-alt mr-2 text-indigo-600"></i> Upload Video
          </h2>
          <div class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center hover:border-indigo-500 transition-colors cursor-pointer" id="dropZone">
              <input type="file" id="upload" class="hidden" accept="video/*" />
              <label for="upload" class="cursor-pointer">
                <i class="fas fa-file-video text-4xl text-gray-400 mb-2"></i>
                <p class="text-sm text-gray-500" id="fileNameDisplay">Click or drag video to upload</p>
              </label>
            </div>
            <button id="uploadBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center">
              <i class="fas fa-upload mr-2"></i> Upload Now
            </button>
          </div>
        </div>

        <!-- Video List Section -->
        <div class="glass rounded-2xl shadow-xl p-6 border border-white/20">
          <h2 class="text-xl font-semibold mb-4 flex items-center">
            <i class="fas fa-list mr-2 text-indigo-600"></i> Library
          </h2>
          <div id="videoList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
            <p class="text-gray-400 text-center py-4">No videos uploaded yet</p>
          </div>
        </div>
      </div>

      <!-- Right Column: Stream Control & Settings -->
      <div class="lg:col-span-2 space-y-8">
        <div class="glass rounded-2xl shadow-xl p-8 border border-white/20">
          <h2 class="text-2xl font-bold mb-6 flex items-center">
            <i class="fas fa-broadcast-tower mr-3 text-indigo-600"></i> Stream Configuration
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="space-y-2">
              <label class="text-sm font-semibold text-gray-700">Stream Key</label>
              <div class="relative">
                <input type="password" id="streamkey" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all" placeholder="Paste your stream key here" />
                <i class="fas fa-key absolute left-3 top-4 text-gray-400"></i>
                <button onclick="toggleKey()" class="absolute right-3 top-4 text-gray-400 hover:text-indigo-600">
                  <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>
            
            <div class="space-y-2">
              <label class="text-sm font-semibold text-gray-700">Select Content</label>
              <div class="relative">
                <select id="selectedVideo" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none appearance-none transition-all">
                  <option value="">-- Choose from Library --</option>
                </select>
                <i class="fas fa-play-circle absolute left-3 top-4 text-gray-400"></i>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="space-y-2">
              <label class="text-sm font-semibold text-gray-700">Loop Mode</label>
              <div class="flex items-center space-x-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                <span class="text-sm text-gray-600">Off</span>
                <button id="loopToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-300 transition-colors focus:outline-none">
                  <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1" id="loopDot"></span>
                </button>
                <span class="text-sm text-gray-600 font-bold">On</span>
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-semibold text-gray-700">Smart Settings</label>
              <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100 text-indigo-700 text-sm flex items-center">
                <i class="fas fa-magic mr-2"></i> Auto-resolution & Bitrate active
              </div>
            </div>
          </div>

          <div class="flex flex-col md:flex-row gap-4">
            <button id="startBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-green-200 flex items-center justify-center text-lg">
              <i class="fas fa-play mr-2"></i> Go Live
            </button>
            <button id="stopBtn" class="hidden flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-red-200 flex items-center justify-center text-lg">
              <i class="fas fa-stop mr-2"></i> Stop Stream
            </button>
          </div>
        </div>

        <!-- Status & Analytics -->
        <div class="glass rounded-2xl shadow-xl p-6 border border-white/20">
          <h2 class="text-xl font-semibold mb-4 flex items-center">
            <i class="fas fa-chart-line mr-2 text-indigo-600"></i> Real-time Analytics
          </h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
              <p class="text-xs text-gray-500 uppercase font-bold">Status</p>
              <p id="statusText" class="text-lg font-semibold text-gray-400">Offline</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
              <p class="text-xs text-gray-500 uppercase font-bold">Uptime</p>
              <p id="uptimeText" class="text-lg font-semibold text-gray-700">00:00:00</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
              <p class="text-xs text-gray-500 uppercase font-bold">CPU Load</p>
              <p id="cpuText" class="text-lg font-semibold text-gray-700">0%</p>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
              <p class="text-xs text-gray-500 uppercase font-bold">Memory</p>
              <p id="memText" class="text-lg font-semibold text-gray-700">0%</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
